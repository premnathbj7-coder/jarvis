# ============================================================
# JARVIS Master Configuration
# Values here are safe defaults. Secrets live in .env, not here.
# ============================================================

assistant:
  name: "JARVIS"
  wake_word: "hey jarvis"
  wake_word_enabled: true
  personality: "professional"          # professional | casual | concise
  greeting: "Good day. JARVIS is online. How may I assist you?"

ai:
  provider: "ollama"                   # local Ollama backend
  ollama_base_url: "http://localhost:11434"
  router_model: "phi3:mini"
  brain_model: "gemma3:12b-it-q4_K_M"
  embedding_model: "nomic-embed-text"
  max_tokens: 1024
  temperature: 0.6
  history_turns: 12                    # how many past turns to keep in context

voice:
  enabled: true
  stt_engine: "google"                 # google (via SpeechRecognition)
  tts_engine: "pyttsx3"
  tts_rate: 185
  tts_volume: 1.0
  tts_voice_index: 0
  input_device_index: null             # null = system default
  output_device_index: null
  listen_timeout_seconds: 6
  phrase_time_limit_seconds: 12

wake_word:
  engine: "porcupine"                  # porcupine | none
  keyword: "jarvis"
  sensitivity: 0.6

ui:
  theme: "dark"
  accent_color: "#00d4ff"
  window_width: 900
  window_height: 640
  start_minimized: false
  always_on_top: false

orb:
  animation_fps: 30                    # capped for integrated GPU
  intensity: 0.8
  particle_count: 40
  ring_count: 3
  audio_reactive: true

memory:
  db_path: "data/database/jarvis.db"
  conversation_retention_days: 30
  auto_persist_facts: false            # never auto-save without user approval

security:
  require_confirmation_for_destructive: true
  allow_shell_execution: false
  allow_system_shutdown: false
  allowed_app_launch_only: true
  confirmation_timeout_seconds: 20

web:
  search_enabled: true
  search_result_limit: 5
  weather_units: "metric"

logging:
  level: "INFO"                        # DEBUG | INFO | WARNING | ERROR
  log_dir: "data/logs"
  max_log_size_mb: 5
  backup_count: 3
  log_sensitive_data: false

applications:
  chrome: "chrome.exe"
  edge: "msedge.exe"
  firefox: "firefox.exe"
  vscode: "code.exe"
  notepad: "notepad.exe"
  calculator: "calc.exe"
  explorer: "explorer.exe"
  settings: "ms-settings:"
  spotify: "spotify.exe"
  discord: "discord.exe"
  steam: "steam.exe"
  whatsapp: "whatsapp.exe"
  telegram: "telegram.exe"
  paint: "mspaint.exe"
  task_manager: "taskmgr.exe"
  control_panel: "control.exe"
